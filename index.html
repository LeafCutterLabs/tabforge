<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabFORGE</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./assets/utilities.css">
    <script src="./assets/icons.js"></script>
    <script src="./assets/jszip.min.js"></script>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./editor.css">
</head>
<body class="font-sans h-screen flex flex-col overflow-hidden">
    <header id="app-header" class="shrink-0">
        <div class="brand-lockup" aria-label="tabFORGE">
            <span class="brand-tab">tab</span><span class="brand-forge">FORGE</span>
        </div>

        <nav class="app-menus" aria-label="Application menus">
            <details class="app-menu">
                <summary>File <i data-lucide="chevron-down"></i></summary>
                <div class="menu-popover">
                    <button id="import-btn" class="menu-item"><i data-lucide="file-up"></i><span>Import text files</span></button>
                    <button id="export-tab-btn" class="menu-item"><i data-lucide="file-down"></i><span>Export current tab</span></button>
                    <button id="export-all-btn" class="menu-item"><i data-lucide="archive"></i><span>Export all tabs</span></button>
                    <div class="menu-separator"></div>
                    <button id="manual-save-all-btn" class="menu-item"><i data-lucide="save-all"></i><span>Save all</span></button>
                    <button id="restore-save-btn" class="menu-item"><i data-lucide="history"></i><span>Restore last save</span></button>
                    <button id="print-btn" class="menu-item"><i data-lucide="printer"></i><span>Print</span></button>
                </div>
            </details>
            <details class="app-menu">
                <summary>Edit <i data-lucide="chevron-down"></i></summary>
                <div class="menu-popover">
                    <button class="menu-item menu-proxy" data-proxy="undo-btn"><i data-lucide="undo-2"></i><span>Undo</span><kbd>Ctrl Z</kbd></button>
                    <button class="menu-item menu-proxy" data-proxy="redo-btn"><i data-lucide="redo-2"></i><span>Redo</span><kbd>Ctrl Y</kbd></button>
                    <button class="menu-item menu-proxy" data-proxy="open-find-btn"><i data-lucide="search"></i><span>Find and replace</span><kbd>Ctrl F</kbd></button>
                </div>
            </details>
            <details class="app-menu">
                <summary>View <i data-lucide="chevron-down"></i></summary>
                <div class="menu-popover">
                    <button id="toggle-line-numbers" class="menu-item"><i data-lucide="list-ordered"></i><span>Line numbers</span></button>
                    <button id="toggle-zebra" class="menu-item"><i data-lucide="rows-3"></i><span>Zebra rows</span></button>
                    <button id="zoom-out-btn" class="menu-item"><i data-lucide="zoom-out"></i><span>Zoom out</span></button>
                    <button id="zoom-in-btn" class="menu-item"><i data-lucide="zoom-in"></i><span>Zoom in</span></button>
                </div>
            </details>
        </nav>

        <div class="header-actions">
            <button id="open-find-btn" class="search-launch" title="Find (Ctrl+F)">
                <i data-lucide="search"></i><span>Find (Ctrl+F)</span><i data-lucide="chevron-down" class="search-chevron"></i>
            </button>
            <button id="open-settings-btn" class="settings-button" title="Settings">
                <i data-lucide="settings"></i><span>Settings</span><i data-lucide="chevron-down"></i>
            </button>
        </div>

        <div id="find-bar" class="hidden search-panel">
            <div class="search-field"><i data-lucide="search"></i><input id="find-input" type="text" placeholder="Find in current tab"></div>
            <div class="search-field"><i data-lucide="replace"></i><input id="replace-input" type="text" placeholder="Replace with"></div>
            <button id="find-next-btn" class="search-action" title="Find Next"><i data-lucide="arrow-down"></i></button>
            <button id="replace-btn" class="search-action" title="Replace Current"><i data-lucide="replace"></i></button>
            <button id="replace-all-btn" class="search-action" title="Replace All"><i data-lucide="replace-all"></i></button>
            <label class="fuzzy-toggle"><input id="find-fuzzy-toggle" type="checkbox"><span>Fuzzy</span></label>
            <div id="find-meta"><span id="find-count">0 matches</span><span aria-hidden="true"> · </span><span id="find-other-tabs">0 other</span></div>
        </div>
        <input type="file" id="file-input" class="hidden" multiple accept=".txt">
    </header>

    <div id="app-body" class="flex flex-1 overflow-hidden flex-col tabs-horizontal">
        <div id="tab-strip">
            <nav id="tabs-container" class="flex shrink-0 overflow-auto no-scrollbar" aria-label="Open documents"></nav>
            <button id="add-tab-btn" class="add-tab-button" title="New file" aria-label="New file"><i data-lucide="plus"></i></button>
        </div>

        <div id="editor-workspace">
            <div id="toolbar-buttons" role="toolbar" aria-label="Editor controls">
                <div class="save-split">
                    <button id="manual-save-btn" class="toolbar-button toolbar-primary" title="Save"><i data-lucide="save"></i><span>Save</span></button>
                    <button class="toolbar-primary save-menu-proxy" data-proxy="manual-save-all-btn" title="Save all"><i data-lucide="chevron-down"></i></button>
                </div>
                <span class="toolbar-separator"></span>
                <button id="undo-btn" class="toolbar-button" title="Undo"><i data-lucide="undo-2"></i><span>Undo</span></button>
                <button id="redo-btn" class="toolbar-button" title="Redo"><i data-lucide="redo-2"></i><span>Redo</span></button>
                <span class="toolbar-separator"></span>
                <button id="toggle-outline-mode" class="toolbar-button toolbar-toggle" title="Toggle Magic Outline Mode">
                    <i data-lucide="list-tree"></i><span>Magic outline</span><span class="switch-control" aria-hidden="true"></span>
                </button>
                <button id="outline-level-filter-btn" class="toolbar-button toolbar-select hidden" title="Cycle Outline Level Filter">
                    <i data-lucide="list"></i><span id="outline-level-filter-label">All levels</span><i data-lucide="chevron-down"></i>
                </button>
                <span class="toolbar-separator"></span>
                <button id="toggle-hide-completed" class="toolbar-button toolbar-toggle" title="Hide DONE Lines">
                    <i data-lucide="eye-off"></i><span>Hide DONE</span><span class="switch-control" aria-hidden="true"></span>
                </button>
                <span class="toolbar-separator"></span>
                <button id="toggle-word-wrap" class="toolbar-button toolbar-toggle" title="Word Wrap">
                    <i data-lucide="text-wrap"></i><span>Wrap</span><span class="switch-control" aria-hidden="true"></span>
                </button>
                <span class="toolbar-separator"></span>
                <button id="toggle-view-mode" class="toolbar-button toolbar-select" title="Cycle View Layout">
                    <svg id="view-mode-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
                    <span id="view-mode-label">Single view</span><i data-lucide="chevron-down"></i>
                </button>
            </div>
            <main id="editor-container" class="flex-1 relative overflow-hidden"></main>
        </div>
    </div>

    <footer class="status-bar shrink-0">
        <div class="save-indicator"><span class="save-check"><i data-lucide="check"></i></span><span id="save-status">Autosave active</span></div>
        <span id="status-filename" class="status-filename">untitled.txt</span>
        <div class="document-stats">
            <span>Lines: <b id="stat-lines">1</b></span>
            <span>Words: <b id="stat-words">0</b></span>
            <span>Characters: <b id="stat-chars">0</b></span>
            <span id="stat-outline-levels" class="hidden"></span>
            <span>Read time: <b id="stat-time">1m</b></span>
            <span>UTF-8</span>
            <span id="status-mode" class="sr-only">Editor Active</span>
        </div>
    </footer>

    <!-- Settings Overlay -->
    <div id="settings-overlay" class="fixed inset-0 bg-black/40 hidden z-[60] transition-opacity duration-200 opacity-0"></div>
    <aside id="settings-menu" class="fixed top-0 right-0 h-full bg-white border-l border-slate-200 z-[70] p-6 transition-colors overflow-y-auto text-slate-800">
        <div class="flex items-center justify-between mb-8">
            <h2 class="text-xs font-bold uppercase tracking-widest text-slate-400">Settings</h2>
            <button id="close-settings-btn" class="p-1 hover:bg-slate-100 rounded text-slate-400"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>

        <div class="settings-grid">
            <div class="settings-column">
                <div>
                    <label class="block text-[10px] uppercase font-bold text-slate-500 mb-3">Interface Theme</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="mode-btn p-2 border border-slate-200 rounded text-[10px] font-bold uppercase hover:bg-slate-50 transition-colors" data-mode="default">Default</button>
                        <button class="mode-btn p-2 border border-slate-200 rounded text-[10px] font-bold uppercase hover:bg-slate-50 transition-colors" data-mode="dark">Dark</button>
                        <button class="mode-btn p-2 border border-slate-200 rounded text-[10px] font-bold uppercase hover:bg-slate-50 transition-colors" data-mode="matrix">Matrix</button>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <label class="block text-[10px] uppercase font-bold text-slate-500 mb-3">Accent Color</label>
                    <div class="flex items-center gap-2">
                        <button id="accent-swatch-btn" type="button" class="swatch-preview border border-slate-300 rounded" title="Choose Accent Color"></button>
                        <input type="color" id="accent-color-picker" class="sr-only" value="#2563eb">
                        <div class="flex items-center bg-slate-50 rounded px-2 py-1.5 border border-slate-200 flex-1">
                            <span class="text-[10px] font-mono text-slate-400 mr-2">#</span>
                            <input type="text" id="hex-accent" class="bg-transparent border-none outline-none text-xs font-mono w-full text-slate-600" maxlength="6" placeholder="2563eb">
                        </div>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <label class="block text-[10px] uppercase font-bold text-slate-500 mb-3">Special Markup Colors</label>
                    <div class="space-y-2" id="special-color-settings">
                        <label class="special-color-row"><span>!!</span><input type="color" data-special-color="urgent"><div class="special-color-hex-wrapper"><span>#</span><input type="text" class="special-color-hex-input" data-special-color-hex="urgent" maxlength="6" placeholder="E11900"></div></label>
                        <label class="special-color-row"><span>??</span><input type="color" data-special-color="question"><div class="special-color-hex-wrapper"><span>#</span><input type="text" class="special-color-hex-input" data-special-color-hex="question" maxlength="6" placeholder="FF8A00"></div></label>
                        <label class="special-color-row"><span>--</span><input type="color" data-special-color="defer"><div class="special-color-hex-wrapper"><span>#</span><input type="text" class="special-color-hex-input" data-special-color-hex="defer" maxlength="6" placeholder="00B8FF"></div></label>
                        <label class="special-color-row"><span>**</span><input type="color" data-special-color="important"><div class="special-color-hex-wrapper"><span>#</span><input type="text" class="special-color-hex-input" data-special-color-hex="important" maxlength="6" placeholder="7A3CFF"></div></label>
                        <label class="special-color-row"><span>DONE</span><input type="color" data-special-color="done"><div class="special-color-hex-wrapper"><span>#</span><input type="text" class="special-color-hex-input" data-special-color-hex="done" maxlength="6" placeholder="00B84D"></div></label>
                        <label class="special-color-row"><span>@</span><input type="color" data-special-color="mention"><div class="special-color-hex-wrapper"><span>#</span><input type="text" class="special-color-hex-input" data-special-color-hex="mention" maxlength="6" placeholder="0057FF"></div></label>
                        <label class="special-color-row"><span>#</span><input type="color" data-special-color="tag"><div class="special-color-hex-wrapper"><span>#</span><input type="text" class="special-color-hex-input" data-special-color-hex="tag" maxlength="6" placeholder="FFD400"></div></label>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <label class="block text-[10px] uppercase font-bold text-slate-500 mb-3">Export Preferences</label>
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" id="zip-export-toggle" class="w-4 h-4 rounded text-accent focus:ring-accent border-slate-300">
                        <label for="zip-export-toggle" class="text-xs text-slate-600">Package all exports as .zip</label>
                    </div>
                    <div class="flex items-center space-x-2 mt-2">
                        <input type="checkbox" id="date-time-export-toggle" class="w-4 h-4 rounded text-accent focus:ring-accent border-slate-300">
                        <label for="date-time-export-toggle" class="text-xs text-slate-600">Append date/time to filenames (ISO 8601)</label>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <label class="block text-[10px] uppercase font-bold text-slate-500 mb-3">Print Preferences</label>
                    <div class="flex items-center space-x-2">
                        <input type="checkbox" id="print-line-numbers-toggle" class="w-4 h-4 rounded text-accent focus:ring-accent border-slate-300">
                        <label for="print-line-numbers-toggle" class="text-xs text-slate-600">Include line numbers</label>
                    </div>
                </div>

                <div class="pt-4 border-t border-slate-100">
                    <label class="block text-[10px] uppercase font-bold text-slate-500 mb-3">Tab Orientation</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="tabs-top-btn" class="orientation-btn p-2 border border-slate-200 rounded text-[10px] font-bold uppercase transition-colors" type="button">
                            <span class="orientation-preview orientation-preview-top"></span>
                            Top Tabs
                        </button>
                        <button id="tabs-side-btn" class="orientation-btn p-2 border border-slate-200 rounded text-[10px] font-bold uppercase transition-colors" type="button">
                            <span class="orientation-preview orientation-preview-side"></span>
                            Side Tabs
                        </button>
                    </div>
                </div>
            </div>

            <div class="settings-column">
                <div class="pt-4 border-t border-slate-100">
                    <button id="reset-theme-btn" class="w-full py-2 bg-slate-50 hover:bg-slate-100 text-slate-400 rounded text-[10px] font-bold uppercase transition-colors">Restore Defaults</button>
                </div>
            </div>
        </div>
    </aside>

    <script src="./tab-model.js"></script>
    <script src="./persistence.js"></script>
    <script src="./commands.js"></script>
    <script src="./app.js"></script>
</body>
</html>
